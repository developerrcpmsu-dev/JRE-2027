<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Burp canary after hardening — staging only</title>
  <desc id="desc">Generated evidence summary of the staging-only Burp mutation test after the database trigger and RLS controls were applied.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132b25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="70" y="60" width="1460" height="780" rx="34" fill="#0f172a" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
  <text x="125" y="145" fill="#6ee7b7" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">BURP CANARY · AFTER HARDENING</text>
  <text x="125" y="205" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">Staging mutation test passed</text>
  <text x="125" y="255" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">Generated evidence summary · not a native Burp UI screenshot</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="28">
    <rect x="125" y="315" width="1350" height="74" rx="14" fill="#111827" stroke="#334155"/>
    <text x="160" y="362" fill="#cbd5e1">Target: Supabase staging · synthetic UUID only</text>

    <rect x="125" y="412" width="1350" height="74" rx="14" fill="#052e2b" stroke="#10b981"/>
    <text x="160" y="459" fill="#a7f3d0">GET  /registrations  →  200 []       (anon cannot read canary)</text>

    <rect x="125" y="509" width="1350" height="74" rx="14" fill="#052e2b" stroke="#10b981"/>
    <text x="160" y="556" fill="#a7f3d0">PATCH group/room/status → 200 []       (no visible mutation)</text>

    <rect x="125" y="606" width="1350" height="74" rx="14" fill="#052e2b" stroke="#10b981"/>
    <text x="160" y="653" fill="#a7f3d0">DB owner re-check    → confirmed / blank / blank</text>

    <rect x="125" y="703" width="1350" height="74" rx="14" fill="#052e2b" stroke="#10b981"/>
    <text x="160" y="750" fill="#a7f3d0">Canary cleanup       → 0 rows        · production unchanged</text>
  </g>

  <circle cx="1410" cy="155" r="34" fill="#10b981"/>
  <path d="M1394 155l11 11 22-27" fill="none" stroke="#052e2b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
